function buildNet(){const maxNodes=mapDepth===2?48:40;let ids=new Set([mapFocus]),queue=[{id:mapFocus,d:0}],distance={[mapFocus]:0};while(queue.length&&ids.size<maxNodes){let {id,d}=queue.shift();if(d>=mapDepth)continue;let items=neighbors(id).filter(x=>selectedKinds.has(x.edge.kind)).sort((a,b)=>{let aa=a.node.kind==='organization'?0:1,bb=b.node.kind==='organization'?0:1;return aa-bb||a.node.name.localeCompare(b.node.name)});for(let p of items){if(ids.size>=maxNodes)break;if(!ids.has(p.node.id)){ids.add(p.node.id);distance[p.node.id]=d+1;queue.push({id:p.node.id,d:d+1})}}}

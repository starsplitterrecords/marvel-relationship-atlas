name: Publish Marvel Relationship Atlas

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'atlas.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'service-worker.js'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp index.html atlas.html manifest.webmanifest icon.svg service-worker.js _site/
          cp data/*.json _site/data/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4

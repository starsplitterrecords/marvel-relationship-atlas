name: Validate atlas data
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical JSON
        run: python scripts/validate_data.py
      - name: Report interpersonal coverage and concentration
        run: python scripts/coverage_audit.py
      - name: Validate editorial research and identities
        run: python scripts/validate_editorial.py
      - name: Check interactive mobile app syntax
        run: node --check app.js
